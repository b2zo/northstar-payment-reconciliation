name: local-controls
on:
  push:
  pull_request:
jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python src/engagement.py --generate --count 1000 --data data/ci --db data/ci.sqlite
