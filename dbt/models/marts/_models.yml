version: 2
models:
  - name: fct_reconciliation
    description: One current classification per captured transaction at the selected as-of date.
    columns:
      - name: TRANSACTION_ID
        data_tests: [not_null, unique]
      - name: RECONCILIATION_STATUS
        data_tests:
          - accepted_values:
              arguments:
                values: ['matched', 'pending', 'overdue_unsettled', 'short_settled', 'over_settled']
  - name: fct_payout_control
    columns:
      - name: PAYOUT_ID
        data_tests: [not_null, unique]
  - name: fct_orphan_lines
    columns:
      - name: LINE_ID
        data_tests: [not_null, unique]
